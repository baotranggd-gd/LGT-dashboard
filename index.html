<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logistics Performance Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg:#f5f7fb; --panel:#fff; --text:#172033; --muted:#778198;
      --line:#e8ecf3; --blue:#356df3; --blue-soft:#edf3ff;
      --green:#16a36a; --green-soft:#eaf8f1; --red:#e34d59;
      --red-soft:#fff0f1; --amber:#d98a18; --amber-soft:#fff6e8;
      --nav:#111b31; --shadow:0 5px 20px rgba(24,39,75,.055);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,Arial,sans-serif}
    .app{display:flex;min-height:100vh}
    aside{width:238px;background:var(--nav);color:#fff;padding:24px 16px;display:flex;flex-direction:column;flex-shrink:0}
    .brand{display:flex;align-items:center;gap:11px;padding:2px 8px 28px}
    .brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#4e83ff,#2753d7);display:grid;place-items:center;font-weight:800}
    .brand strong{display:block;font-size:14px;letter-spacing:.08em}
    .brand small{color:#aab5ca;font-size:10px;letter-spacing:.12em}
    .nav-label{color:#8794ad;font-size:10px;font-weight:700;letter-spacing:.13em;padding:12px 10px 8px}
    .nav-btn{border:0;background:transparent;color:#b9c4d8;padding:12px 13px;border-radius:9px;text-align:left;width:100%;cursor:pointer;margin:2px 0;font:inherit;display:flex;gap:12px;align-items:center}
    .nav-btn:hover,.nav-btn.active{background:#243653;color:#fff}
    .nav-icon{width:18px;text-align:center;font-size:16px}
    .side-foot{margin-top:auto;color:#8794ad;font-size:11px;padding:14px 10px;border-top:1px solid #2a3851}
    main{flex:1;min-width:0;padding:27px 30px 40px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:23px}
    .eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--blue);text-transform:uppercase}
    h1{font-size:25px;letter-spacing:-.6px;margin:4px 0}
    .subtitle{color:var(--muted);font-size:12px}
    .top-actions{display:flex;align-items:center;gap:9px}
    button,.select{font:inherit}
    .btn{border:1px solid var(--line);background:#fff;color:#34405a;border-radius:9px;padding:9px 13px;cursor:pointer}
    .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
    .btn:hover{filter:brightness(.98)}
    .filters{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr)) auto;gap:10px;background:var(--panel);padding:14px;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:18px}
    .filter label{display:block;font-size:10px;color:var(--muted);font-weight:700;margin:0 0 5px 2px}
    select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;color:#34405a;outline:none}
    .filter-actions{display:flex;align-items:end;gap:7px}
    .grid{display:grid;gap:14px}
    .kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:15px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow);min-width:0}
    .kpi-top{display:flex;justify-content:space-between;align-items:center}
    .kpi-label{color:var(--muted);font-size:11px;font-weight:600}
    .kpi-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
    .kpi-value{font-size:26px;font-weight:750;letter-spacing:-.8px;margin:10px 0 3px}
    .kpi-note{font-size:10px;color:var(--muted)}
    .charts{grid-template-columns:1.55fr 1fr;margin-bottom:15px}
    .charts.equal{grid-template-columns:1fr 1fr}
